# pubspec.yaml
name: soundmindai
description: "SoundMind AI - Intelligent Audio Classifier & Safe Local Music Player."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.2
  on_audio_query: ^2.9.0
  just_audio: ^0.10.6
  share_plus: ^10.1.2
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  flutter_volume_controller: ^2.0.1
  google_fonts: ^6.2.1
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^22.3.0
  sqflite: ^2.4.1
  path: ^1.9.0
  path_provider: ^2.1.5
  speech_to_text: ^7.0.0
  youtube_explode_dart: ^3.1.0
  dio: ^5.11.1
  ffmpeg_kit_flutter_new: ^4.6.2
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.2
  flutter_native_splash: ^2.4.4
  sqflite_common_ffi: ^2.3.4

dependency_overrides:
  sqflite_android: 2.4.1
  sqflite: 2.4.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/dark-icon.png"
  adaptive_icon_background: "#030712"
  adaptive_icon_foreground: "assets/icon/dark-icon.png"

flutter_native_splash:
  color: "#030712"
  image: "assets/icon/dark-icon.png"
  android_12:
    color: "#030712"
    image: "assets/icon/dark-icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/icon/
    - assets/bg/
    - assets/gif/
  fonts:
    - family: Avoiste
      fonts:
        - asset: assets/fonts/Avoiste.otf
    - family: JakeKeller
      fonts:
        - asset: assets/fonts/JakeKeller.otf